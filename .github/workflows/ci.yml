name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  integration:
    name: Setup & Playwright End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ly_fullstack_e2e_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ly_fullstack_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SETUP_DATABASE_PASSWORD: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      SETUP_DATABASE_NAME: ly_fullstack_ci
      SETUP_ADMIN_PASSWORD: ci-setup-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_DATABASE_URL: postgresql://postgres:ci-db-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ly_fullstack_e2e_ci?schema=public
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask ephemeral test credentials
        shell: bash
        run: |
          echo "::add-mask::$SETUP_DATABASE_PASSWORD"
          echo "::add-mask::$SETUP_ADMIN_PASSWORD"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          echo "::add-mask::$E2E_DATABASE_URL"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pnpm setup on Linux and PostgreSQL
        run: pnpm run setup -- --non-interactive

      - name: Verify setup migrations and seed data
        run: pnpm verify:setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
