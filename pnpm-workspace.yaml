packages:
  - 'apps/*'
  - 'packages/*'

verifyDepsBeforeRun: error

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: false
  es5-ext: false
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true

catalog:
  '@playwright/test': 1.62.1
  '@rspress/core': 2.0.20
  '@bprogress/core': 1.3.4
  '@commitlint/cli': 21.2.2
  '@commitlint/config-conventional': 21.2.2
  '@clack/prompts': 1.7.0
  '@lucide/vue': 1.33.0
  '@eslint/js': 10.0.1
  '@nestjs/common': 11.2.1
  '@nestjs/config': 4.0.4
  '@nestjs/core': 11.2.1
  '@nestjs/jwt': 11.0.2
  '@nestjs/platform-fastify': 11.2.1
  '@nestjs/throttler': 6.5.0
  '@fastify/helmet': 13.1.1
  '@prisma/adapter-pg': 7.9.1
  '@prisma/client': 7.9.1
  '@rsbuild/core': 2.1.13
  '@rsbuild/plugin-image-compress': 1.3.4
  '@rsbuild/plugin-sass': 2.0.1
  '@rsbuild/plugin-vue': 2.0.1
  '@rstest/core': 0.11.9
  '@types/js-cookie': 3.0.6
  '@types/node': 26.2.0
  '@types/pg': 8.23.1
  '@vue/eslint-config-prettier': 10.2.0
  axios: 1.19.0
  bcryptjs: 3.0.3
  class-transformer: 0.5.1
  class-validator: 0.15.1
  compression-webpack-plugin: 12.0.0
  cross-env: 10.1.0
  dotenv-cli: 11.0.0
  echarts: 6.1.0
  element-plus: 2.14.4
  eslint: 10.8.1
  eslint-plugin-vue: 10.10.0
  fastify: 5.12.1
  globals: 17.11.0
  happy-dom: 20.11.6
  husky: 9.1.7
  js-cookie: 3.0.8
  lint-staged: 17.3.0
  pg: 8.23.0
  pinia: 4.0.3
  pinia-plugin-persistedstate: 4.7.1
  plop: 4.0.5
  prettier: 3.9.6
  prisma: 7.9.1
  reflect-metadata: 0.2.2
  rimraf: 6.1.3
  rxjs: 7.8.2
  sass: 1.103.0
  sharp: 0.35.3
  tsx: 4.23.12
  turbo: 2.10.10
  typescript: 6.0.2
  typescript-eslint: 8.67.0
  unplugin-auto-import: 21.1.0
  unplugin-vue-components: 32.1.0
  vue: 3.5.41
  vue-eslint-parser: 10.4.1
  vue-router: 5.2.0
  xgplayer: 3.0.26
  vue-tsc: 3.3.10

overrides:
  deepmerge-ts: 8.0.2
  fastify: 'catalog:'
  'ini@<1.3.6': 1.3.8
  # Rspress 的 ESM Markdown 构建需要支持原生默认导入的 style-to-js 版本
  style-to-js: 1.1.21
  vue: 'catalog:'
  typescript: 'catalog:'

minimumReleaseAgeExclude:
  - '@playwright/test@1.62.1'
  - happy-dom@20.11.6
  - '@lucide/vue@1.33.0'
  - '@rstest/core@0.11.9'
  - '@nestjs/throttler@6.5.0'
  - '@fastify/helmet@13.1.1'
  - sass@1.103.0
